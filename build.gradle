        version {
            // Version used in your workspace and bundled in mod jar
            prefer "${version_thutapi}"
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    if(it.description.contains(" main ")) dependsOn generateXaeroPokemobIconResources
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_version            : mod_version,
            version_thutapi        : version_thutapi,
            version_thutcore       : version_thutcore,
            version_pokecube_core  : version_pokecube_core,
            version_wearables      : version_wearables,
            version_bling          : version_bling,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
