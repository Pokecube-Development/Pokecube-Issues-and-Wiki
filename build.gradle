static def incrementVersion(String versionIn, String versionRef){
    def oldVerSplit = versionRef.split(/[.]/)
    def oldMajor = oldVerSplit[0].toInteger()
    def oldSub = oldVerSplit[1].toInteger()
    def splis = versionIn.split(/[.]/)
    def majver = splis[0].toInteger()
    def subver = splis[1].toInteger()
    if (oldMajor!=majver || oldSub!=subver) return versionRef
    def offset = splis[2].toInteger()
    def ver = offset + 1
    return "${majver}.${subver}.${ver}"
}

def gitVersion() {
    try {
        def gitDir = file('.git/refs/tags/')
        def tagFiles = gitDir.listFiles().sort()
        def index = tagFiles.findLastIndexOf {
            it.getName().startsWith("${minecraft_version}-")
        }
        def raw = tagFiles[index].getName().replaceFirst("${minecraft_version}-", "")
        def desc = (raw == null ? 'unknown-offset-hash' : raw.split('-')) as List
        def vars = desc.get(0)
        return incrementVersion(vars.toString(), mod_version)
    }
    catch (Exception ignored) {
        return mod_version
    }
}

