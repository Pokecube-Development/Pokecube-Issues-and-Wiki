// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach { run ->
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        run.modSource sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_group_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_group_id
    }

    data {
        arguments.addAll '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }

    data_adv {
        run 'data'
        arguments.addAll '--mod', "pokecube_adventures"
    }

    data_mob {
        run 'data'
        arguments.addAll '--mod', "pokecube_mobs"
    }

    client_1 {
        run 'client'
        arguments '--username', 'Dev1'
    }

    client_2 {
        run 'client'
        arguments '--username', 'Dev2'
    }

    client_3 {
        run 'client'
        arguments '--username', 'Dev3'
    }
}

