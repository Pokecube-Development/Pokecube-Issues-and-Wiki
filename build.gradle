def thutAPIJar = tasks.register("subJar-thutAPI", Jar) {
    from(sourceSets.thutapi.output)
    archiveClassifier = ""
    var version = incrementVersion(version_thutapi, version_thutapi)
    var _filename = "thutapi-${minecraft_version}-${version}.jar"
    archiveFileName = _filename

    doLast {
        var madeFile = file("build/libs/${_filename}")
        var newFile = file("libs/${_filename}")
        if (newFile.exists()) newFile.delete()
        madeFile.renameTo(newFile)
    }
}

