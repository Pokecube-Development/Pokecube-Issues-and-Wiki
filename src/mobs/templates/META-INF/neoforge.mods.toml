description='''
General mobs provider for Pokécube
'''

[[dependencies.pokecube]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version}"
ordering="NONE"
side="BOTH"

[[dependencies.pokecube]]
modId="neoforge"
mandatory=true
versionRange="${neo_version}"
ordering="NONE"
side="BOTH"