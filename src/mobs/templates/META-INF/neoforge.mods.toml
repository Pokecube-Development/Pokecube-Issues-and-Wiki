modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="MIT"
issueTrackerURL="https://github.com/Pokecube-Development/Pokecube-Issues-and-Wiki/issues" #optional

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="pokecube.mixins.json"

[[mods]]
modId="pokecube"
version="${version_pokecube_core}"
